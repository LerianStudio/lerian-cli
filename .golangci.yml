version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  allow-parallel-runners: true

linters:
  enable:
    # Default linters (gosimple/stylecheck merged into staticcheck in v2)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - revive
    - misspell
    - dupl
    - gosec
    - unconvert
    - unparam
    - prealloc
    - nilerr
    - whitespace
    - noctx
    - bodyclose
    - nolintlint
    - errorlint
    - lll
    - nakedret
    - dogsled
    - goprintffuncname

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close

    govet:
      disable:
        - shadow

    gocyclo:
      min-complexity: 15

    dupl:
      threshold: 100

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104
        - G204
        - G301
        - G304

    misspell:
      locale: US

    lll:
      line-length: 120
      tab-width: 4

    nakedret:
      max-func-lines: 30

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    paths:
      - vendor
      - third_party
      - testdata
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gosec
          - dupl
          - lll
          - errcheck
          - noctx

      - path: cmd/lerian/main\.go
        linters:
          - gochecknoglobals
          - gochecknoinits

      - path: internal/kubectl/
        linters:
          - noctx

      # The infra commands answer an operator at a terminal, so an error there is
      # two lines: what failed, then the command that fixes it. ST1005 and revive's
      # error-strings both assume a single lowercase fragment meant to be wrapped by
      # a caller, which is not what these are — and collapsing them would rewrite
      # output that the port to `lerian infra` is verified to reproduce. 69 sites
      # follow this convention; the exclusion belongs here rather than on each one.
      - path: internal/(infra|infracli)/
        linters:
          - staticcheck
        text: "ST1005:"

      - path: internal/(infra|infracli)/
        linters:
          - revive
        text: "error-strings:"

      - linters:
          - errcheck
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv). is not checked

      - linters:
          - lll
        source: "^//go:generate "

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/lerian-studio/lerian-cli
