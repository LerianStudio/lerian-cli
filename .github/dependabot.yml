version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "area: dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Pinned third-party GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "area: dependencies"
      - "area: ci/cd"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # go-release.yml is deliberately frozen at @v1.3.5: it is the last shared
      # release that still carries the GoReleaser binary pipeline this CLI needs.
      - dependency-name: "LerianStudio/*"
    groups:
      actions-core:
        patterns:
          - "actions/*"
      security-actions:
        patterns:
          - "github/codeql-action*"
          - "aquasecurity/trivy-action"
          - "securego/gosec"
