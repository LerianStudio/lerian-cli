name: Release

on:
  push:
    branches: [develop, release-candidate, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - 'LICENSE'
      - '.gitignore'
      - '.golangci.yml'
      - '.goreleaser.yml'
      - '.coderabbit.yml'
      - '.coderabbit.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/release.yml@tier-1
    with:
      enable_changelog: ${{ github.ref == 'refs/heads/main' }}
      shared_paths: |
        go.mod
        go.sum
        cmd/
        internal/
        Makefile
    secrets: inherit
