name: "Go Combined Analysis"

# Runs Go CI, Security, Tests, Coverage, and Build checks
# Uses centralized shared workflow for maintenance
# Single app mode (not monorepo) - uses filter_paths: '["."]'

on:
  pull_request:
    branches:
      - develop
      - release-candidate
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  go-analysis:
    name: Go Analysis
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/go-pr-analysis.yml@v1.2.0
    with:
      runner_type: "blacksmith-4vcpu-ubuntu-2404"
      # Single-app mode: no filter_paths = run against root directory
      app_name_prefix: "lerian-cli"
      go_version: "1.25"
      golangci_lint_version: "v2.6.2"
      golangci_lint_args: "--timeout=5m"
      coverage_threshold: 25
      fail_on_coverage_threshold: true
      enable_lint: true
      enable_security: true
      enable_tests: true
      enable_coverage: true
      enable_build: true
    secrets:
      manage_token: ${{ secrets.MANAGE_TOKEN }}
