name: Go Security

on:
  push:
    branches: [develop, release-candidate, main]
  pull_request:
    branches: [develop, release-candidate, main]
  schedule:
    # Run security scans every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  pull-requests: write
  statuses: write

jobs:
  security:
    permissions:
      contents: read
      security-events: write
      actions: read
      checks: write
      pull-requests: write
      statuses: write
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/go-security.yml@feature/go-workflows
    with:
      go_version: '1.24'
      enable_dependency_review: true
      enable_gosec: true
      enable_govulncheck: true
      enable_nancy: true
      enable_trivy: true
      enable_secret_scan: true
      enable_license_check: true
      enable_sbom: true
      trivy_severity: 'CRITICAL,HIGH'
      upload_sarif: false
      fail_on_security_issues: true
    secrets: inherit
