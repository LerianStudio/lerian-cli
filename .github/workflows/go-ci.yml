name: Go CI

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches: [develop, release-candidate, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/go-ci.yml@feature/go-workflows
    with:
      go_versions: '["1.24"]'
      operating_systems: '["ubuntu-latest", "macos-latest"]'
      enable_cross_platform_build: true
      build_path: './cmd/lerian'
      enable_coverage_comment: true
      check_docs: true
      check_module_tidy: true
