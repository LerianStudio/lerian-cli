name: CI Gate

# This workflow acts as a gate for semantic-release
# It depends on all CI workflows completing successfully
# Only then will it trigger the semantic-release workflow

on:
  workflow_run:
    workflows:
      - "Go CI"
      - "Unit Tests"
      - "Go Security"
      - "Coverage Check"
    types:
      - completed
    branches:
      - develop
      - release-candidate
      - main

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Check All CI Workflows
    runs-on: ubuntu-latest
    # Only run if the workflow that triggered this was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check workflow status
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = ['Go CI', 'Unit Tests', 'Go Security', 'Coverage Check'];
            const ref = context.payload.workflow_run.head_sha;

            core.info(`Checking workflows for commit: ${ref}`);

            // Get all workflow runs for this commit
            const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: ref,
              per_page: 100
            });

            core.info(`Found ${workflowRuns.workflow_runs.length} workflow runs`);

            // Check if all required workflows completed successfully
            const requiredWorkflows = {};
            for (const workflow of workflows) {
              requiredWorkflows[workflow] = false;
            }

            for (const run of workflowRuns.workflow_runs) {
              if (workflows.includes(run.name) && run.conclusion === 'success') {
                requiredWorkflows[run.name] = true;
                core.info(`✓ ${run.name}: success`);
              } else if (workflows.includes(run.name)) {
                core.info(`✗ ${run.name}: ${run.conclusion || run.status}`);
              }
            }

            // Check if all required workflows passed
            const allPassed = Object.values(requiredWorkflows).every(v => v === true);

            if (!allPassed) {
              const missing = Object.entries(requiredWorkflows)
                .filter(([, passed]) => !passed)
                .map(([name]) => name);
              core.setFailed(`Not all required workflows passed. Missing: ${missing.join(', ')}`);
            } else {
              core.info('✓ All CI workflows completed successfully!');
            }
