name: Semantic Release

on:
  workflow_run:
    workflows:
      - "Go CI"
      - "Go Security"
      - "Unit Tests"
      - "Coverage Check"
    types:
      - completed
    branches:
      - develop
      - main
      - release-candidate
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.ref_name)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release@^23.0.0 \
            @semantic-release/git@^10.0.1 \
            @semantic-release/changelog@^6.0.3 \
            @semantic-release/exec@^6.0.3 \
            conventional-changelog-conventionalcommits@^7.0.2

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.MANAGE_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@users.noreply.github.com
        run: npx semantic-release
