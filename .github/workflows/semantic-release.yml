name: Semantic Release

on:
  push:
    branches:
      - develop
      - main
      - release-candidate
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Wait for all CI checks to complete successfully
  wait-for-checks:
    name: Wait for CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Go CI
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: 'ci / All Checks Pass'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Wait for Go Security
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: 'security / Security Summary'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Wait for Unit Tests
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: 'unit-tests / Unit Tests'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Wait for Coverage Check
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: 'coverage / Coverage Check'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  # Call shared release workflow after checks pass
  release:
    name: Create Release
    needs: wait-for-checks
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/release.yml@feature/go-workflows
    secrets:
      lerian_studio_push_bot_app_id: ${{ secrets.LERIAN_STUDIO_PUSH_BOT_APP_ID }}
      lerian_studio_push_bot_private_key: ${{ secrets.LERIAN_STUDIO_PUSH_BOT_PRIVATE_KEY }}
      lerian_ci_cd_user_gpg_key: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY }}
      lerian_ci_cd_user_gpg_key_password: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY_PASSWORD }}
      lerian_ci_cd_user_name: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
      lerian_ci_cd_user_email: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
