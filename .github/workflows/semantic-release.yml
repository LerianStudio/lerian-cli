name: Semantic Release

# This workflow creates releases based on conventional commits
# It triggers automatically after all CI checks pass on release branches
# Semantic-release will analyze commits and only create a release if needed

on:
  workflow_run:
    workflows:
      - "Go CI"
    types:
      - completed
    branches:
      - develop
      - main
      - release-candidate
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Create Release
    # Only run if Go CI completed successfully (all other checks are dependencies of Go CI)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/release.yml@feature/go-workflows
    secrets: inherit
