name: Semantic Release

on:
  push:
    branches:
      - develop
      - main
      - release-candidate
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Wait for all checks to pass before running semantic release
  wait-for-checks:
    name: Wait for Checks
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI checks
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-regexp: '(Go CI|Go Security|Unit Tests|Coverage Check).*'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success

  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: wait-for-checks
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release@^23.0.0 \
            @semantic-release/git@^10.0.1 \
            @semantic-release/changelog@^6.0.3 \
            @semantic-release/exec@^6.0.3 \
            conventional-changelog-conventionalcommits@^7.0.2

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.MANAGE_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@users.noreply.github.com
        run: npx semantic-release
