name: Coverage Check

on:
  pull_request:
    branches: [develop, release-candidate, main]
  push:
    branches: [develop, release-candidate, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/go-coverage-check.yml@feature/go-workflows
    with:
      go_version: '1.23'
      coverage_threshold: 25
      fail_on_threshold: true
      enable_pr_comment: true
      report_format: 'both'
    secrets:
      manage_token: ${{ secrets.MANAGE_TOKEN }}
