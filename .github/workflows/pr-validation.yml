name: PR Validation

on:
  pull_request:
    branches: [develop, release-candidate, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  id-token: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  validate:
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/go-pr-validation.yml@tier-1
    with:
      pr_title_scopes: |
        auth
        build
        ci
        cli
        cmd
        config
        deps
        docs
        examples
        infra
        kubectl
        ledger
        output
        scripts
        tests
        version
      app_name_prefix: "lerian-cli"
      go_version: "1.26"
      golangci_lint_version: "v2.12.2"
      coverage_threshold: 55
      allowed_source_branches: 'develop|hotfix/*'
      enable_docker_scan: false
      run_lib_version_check: false
      shared_paths: |
        go.mod
        go.sum
        cmd/
        internal/
        Makefile
        .github/workflows/
    secrets: inherit
