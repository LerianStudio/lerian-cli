# Auto-label PRs based on changed files
# https://github.com/actions/labeler

'area: auth':
  - changed-files:
      - any-glob-to-any-file:
          - cmd/auth/**/*
          - internal/client/**/*

'area: ledger':
  - changed-files:
      - any-glob-to-any-file:
          - cmd/midaz/ledger/**/*

'area: config':
  - changed-files:
      - any-glob-to-any-file:
          - internal/config/**/*

'area: kubectl':
  - changed-files:
      - any-glob-to-any-file:
          - internal/kubectl/**/*

'area: output':
  - changed-files:
      - any-glob-to-any-file:
          - internal/output/**/*

'area: cli':
  - changed-files:
      - any-glob-to-any-file:
          - cmd/root.go
          - cmd/lerian/**/*

'area: documentation':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - docs/**/*

'area: ci/cd':
  - changed-files:
      - any-glob-to-any-file:
          - .github/**/*
          - .golangci.yml
          - .goreleaser.yml

'area: dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - go.mod
          - go.sum

'area: build':
  - changed-files:
      - any-glob-to-any-file:
          - Makefile
          - Dockerfile
          - build/**/*

'area: tests':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*_test.go'

'area: version':
  - changed-files:
      - any-glob-to-any-file:
          - internal/version/**/*
          - cmd/version.go

'area: scripts':
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**/*

'area: examples':
  - changed-files:
      - any-glob-to-any-file:
          - examples/**/*
          - configs/**/*
