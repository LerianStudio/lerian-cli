branches:
  - name: main
    prerelease: false
  - name: release-candidate
    prerelease: rc
  - name: develop
    prerelease: beta

plugins:
  - "@semantic-release/commit-analyzer"
  - "@semantic-release/release-notes-generator"
  # Changelog disabled - using GPT Changelog for stable releases only
  # - "@semantic-release/changelog"
  # Git plugin disabled - no changelog commits needed
  # - - "@semantic-release/git"
  #   - assets:
  #       - CHANGELOG.md
  #     message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
  - - "@semantic-release/github"
    - successComment: "🎉 This PR is included in version ${nextRelease.gitTag} 🎉\n\nThe release is available on [GitHub release](${releases[0].url})\n\nYour **semantic-release** bot 📦🚀"

preset: conventionalcommits

tagFormat: "v${version}"

# Commit analyzer rules
analyzeCommits:
  preset: conventionalcommits
  releaseRules:
    - type: feat
      release: minor
    - type: fix
      release: patch
    - type: perf
      release: patch
    - type: revert
      release: patch
    - type: docs
      release: false
    - type: style
      release: false
    - type: chore
      release: false
    - type: refactor
      release: patch
    - type: test
      release: false
    - type: build
      release: false
    - type: ci
      release: false
    - breaking: true
      release: major
