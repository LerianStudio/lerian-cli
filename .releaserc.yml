branches:
  - name: main
    prerelease: false
  - name: release-candidate
    prerelease: rc
  - name: develop
    prerelease: beta

plugins:
  - "@semantic-release/commit-analyzer"
  - "@semantic-release/release-notes-generator"
  - "@semantic-release/changelog"
  - - "@semantic-release/git"
    - assets:
        - CHANGELOG.md
      message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
  - "@semantic-release/github"

preset: conventionalcommits

tagFormat: "v${version}"

# Commit analyzer rules
analyzeCommits:
  preset: conventionalcommits
  releaseRules:
    - type: feat
      release: minor
    - type: fix
      release: patch
    - type: perf
      release: patch
    - type: revert
      release: patch
    - type: docs
      release: false
    - type: style
      release: false
    - type: chore
      release: false
    - type: refactor
      release: patch
    - type: test
      release: false
    - type: build
      release: false
    - type: ci
      release: false
    - breaking: true
      release: major
